services:
  gdf-ssh-server:
    image: ubuntu:22.04
    container_name: gdf-ssh-server
    ports:
      - "2222:22"
    environment:
      DEBIAN_FRONTEND: noninteractive
    volumes:
      - ./ssh-keys/authorized:/home/deploy/.ssh/authorized_keys
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: /bin/bash
    command:
      - -c
      - |
        apt-get update && apt-get install -y openssh-server sudo docker.io && \
        useradd -m -s /bin/bash deploy && \
        mkdir -p /home/deploy/.ssh && \
        chown deploy:deploy /home/deploy/.ssh && \
        chmod 700 /home/deploy/.ssh && \
        echo "deploy ALL=(ALL) NOPASSWD: /usr/bin/docker" > /etc/sudoers.d/docker && \
        service ssh start && \
        while true; do sleep 1; done
    restart: unless-stopped
